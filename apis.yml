aid: voxeet
name: Voxeet
description: Voxeet was a San Francisco-based startup that built spatial-audio voice
  and video conferencing APIs and SDKs for web and mobile applications, backed by
  500 Global. Dolby Laboratories acquired Voxeet in 2019 and rebranded its technology
  as the Dolby.io Communications APIs and SDKs. That surface has since been retired --
  the voxeet GitHub org archived all 88 repositories on 2024-08-30 and the Dolby.io
  Communications documentation now redirects to Dolby OptiView. This profile preserves
  the historical record; see the dolby and dolby-io profiles for the successor platform.
